<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1100" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c2d91"/>
    </marker>
  </defs>

  <!-- Home -->
  <rect x="20" y="40" width="430" height="400" rx="10" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="40" y="70" font-weight="600" font-size="16">Home (stands in for the office)</text>

  <rect x="40" y="95" width="180" height="64" rx="6" fill="#fff" stroke="#6b6b6b"/>
  <text x="130" y="120" text-anchor="middle" font-weight="600">MacBook</text>
  <text x="130" y="140" text-anchor="middle" fill="#555">192.168.88.x</text>

  <rect x="40" y="205" width="180" height="96" rx="6" fill="#fff" stroke="#6b6b6b"/>
  <text x="130" y="229" text-anchor="middle" font-weight="600">MikroTik hAP</text>
  <text x="130" y="248" text-anchor="middle" fill="#555">LAN 192.168.88.0/24</text>
  <text x="130" y="266" text-anchor="middle" fill="#555">WAN 192.168.0.212</text>
  <text x="130" y="286" text-anchor="middle" fill="#5c2d91">IPsec IKEv2 · NAT-T · my-id</text>
  <line x1="130" y1="159" x2="130" y2="205" stroke="#6b6b6b" stroke-width="1.5"/>

  <rect x="250" y="205" width="180" height="96" rx="6" fill="#fff" stroke="#6b6b6b"/>
  <text x="340" y="229" text-anchor="middle" font-weight="600">Sky Hub</text>
  <text x="340" y="248" text-anchor="middle" fill="#555">LAN 192.168.0.0/24</text>
  <text x="340" y="266" text-anchor="middle" fill="#555">Public IP (Sky)</text>
  <text x="340" y="286" text-anchor="middle" fill="#5c2d91">Fwd UDP 500 + 4500</text>
  <line x1="220" y1="253" x2="250" y2="253" stroke="#6b6b6b" stroke-width="1.5"/>

  <text x="235" y="335" text-anchor="middle" fill="#555" font-style="italic">Double NAT: Sky Hub → MikroTik</text>
  <text x="235" y="355" text-anchor="middle" fill="#555" font-style="italic">Port forwards only allow the Azure gateway IP</text>

  <!-- Tunnel -->
  <text x="555" y="225" text-anchor="middle" fill="#5c2d91" font-weight="600">IPsec tunnel over the internet</text>
  <text x="555" y="243" text-anchor="middle" fill="#555">IKEv2 · AES256 / SHA256</text>
  <text x="555" y="259" text-anchor="middle" fill="#555">DH14 · PFS2048</text>
  <line x1="430" y1="275" x2="680" y2="275" stroke="#5c2d91" stroke-width="3" stroke-dasharray="8 5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="555" y="300" text-anchor="middle" fill="#555">~21 ms Dublin ↔ London</text>

  <!-- Azure -->
  <rect x="680" y="25" width="400" height="430" rx="10" fill="#eef5fc" stroke="#0078d4" stroke-width="1.5"/>
  <text x="700" y="55" font-weight="600" font-size="16" fill="#0078d4">Azure · UK South</text>
  <text x="700" y="75" fill="#555">Vnet_Lab 10.10.0.0/16</text>

  <rect x="700" y="95" width="360" height="130" rx="6" fill="#fff" stroke="#0078d4"/>
  <text x="720" y="118" font-weight="600">Snet_workspace 10.10.1.0/24 (private subnet)</text>
  <text x="720" y="137" fill="#555">NSG: no inbound from internet</text>
  <rect x="780" y="150" width="200" height="60" rx="5" fill="#e1effa" stroke="#0078d4"/>
  <text x="880" y="172" text-anchor="middle" font-weight="600">VmLab01 · Ubuntu 24.04</text>
  <text x="880" y="190" text-anchor="middle" fill="#555">10.10.1.4 · no public IP</text>

  <rect x="700" y="250" width="360" height="110" rx="6" fill="#fff" stroke="#0078d4"/>
  <text x="720" y="273" font-weight="600">GatewaySubnet 10.10.2.0/27</text>
  <rect x="780" y="285" width="200" height="60" rx="5" fill="#e1effa" stroke="#0078d4"/>
  <text x="880" y="308" text-anchor="middle" font-weight="600">VpnGwLab</text>
  <text x="880" y="326" text-anchor="middle" fill="#555">VpnGw1AZ · route-based</text>
  <line x1="880" y1="285" x2="880" y2="210" stroke="#0078d4" stroke-width="1.5"/>

  <text x="700" y="388" fill="#555">LNGHome: home public IP + 192.168.88.0/24</text>
  <text x="700" y="408" fill="#555">ConnHome: S2S IPsec, custom policy, PSK</text>
  <text x="700" y="428" fill="#555">pip_vpngw: Standard, static, zone-redundant</text>
</svg>
